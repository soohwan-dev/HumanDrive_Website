<main class="wrap"><div class="policy-top"><div class="section-tag mono">HUMANDRIVE / LEGAL</div><h1 data-i18n="privacy">개인정보 처리방침</h1><p data-i18n="policyIntro">앱에서 정보가 어떻게 저장되고 처리되는지 안내합니다.</p></div><div class="policy-body"><aside class="policy-side"><span class="mono">DOCUMENT / 01</span><a data-home-link href="../" data-i18n="back">홈으로 돌아가기</a><a href="mailto:imsoohwan.dev@gmail.com">imsoohwan.dev@gmail.com</a><span class="mono" id="policy-count"></span></aside><article class="policy-document" aria-label="Full privacy policy"><div class="exact">OFFICIAL TEXT / ORIGINAL VERSION</div><div class="policy-content" id="policy-raw"></div><a class="back" data-home-link href="../" data-i18n="back">홈으로 돌아가기</a></article></div></main><div class="sep"></div><footer class="footer wrap"><div>© 2026 HumanDrive <span class="muted">/</span> <span data-i18n="footer">사소한 기억을 위한 작은 외부 저장소.</span></div><div class="footer-links"><a data-privacy-link href="./" data-i18n="privacy">개인정보 처리방침</a><a href="../contact/" data-i18n="contact">Contact</a></div></footer>
<script>const POLICY_TEXT = {"ko":"시행일: 2026년 10월 21일\n\nHumanDrive(이하 “앱”)는 개인 개발자 임수환이 운영하는 기록 관리 앱입니다. 기록과 설정은 기본적으로 기기에 저장되며 개발자 서버로 전송되지 않습니다. 별도 앱 회원가입은 없으며 Google Drive 백업, 이메일 문의, 외부 후원은 선택 사항입니다.\n\n1. 기기에 저장하는 정보\n\n앱은 기록의 본문·태그·생성 일시·선택한 리마인드 날짜와 저장·복구에 필요한 식별 정보를 저장하여 조회·검색·수정·삭제에 사용합니다. 언어와 애니메이션 설정도 기기에 저장합니다. 기록에는 이용자가 직접 입력한 개인정보가 포함될 수 있습니다.\n\n기록과 설정은 이용자가 삭제·변경하거나 앱 데이터를 제거할 때까지 유지됩니다. 복구를 위한 과거 사본과 운영체제의 백업·기기 이전 사본은 별도로 남을 수 있습니다.\n\n앱에는 광고, 사용 분석, 광고 식별자 수집 또는 자동 원격 오류 보고 기능이 없습니다. 폰트는 앱에 포함되어 있습니다. 외부 서비스의 자체 접속·진단 정보 처리는 해당 서비스 정책에 따릅니다.\n\n2. 선택적 Google Drive 백업\n\nGoogle 계정을 연결하면 계정 식별자·이메일·표시 이름과 인증 권한을 백업·복원에 사용합니다. 계정 표시 정보와 최근 백업 시각은 기기에 저장하며, 연결 해제 시 표시 정보를 삭제합니다. 일시적인 인증 오류만으로 기존 표시 정보가 삭제되지는 않습니다. 인증 상태와 토큰은 Google SDK와 운영체제가 관리하며, 앱은 자체 파일이나 백업에 토큰을 영구 저장하지 않습니다.\n\n백업·조회·복원을 이용하면 전체 기록과 태그, 앱 버전 및 백업 관리 정보가 기기와 Google Drive 사이에 직접 전송됩니다. 개발자 서버를 거치지 않으며 계정 정보와 인증 토큰은 백업에 포함하지 않습니다. Drive 화면에서는 기존 인증 상태를 확인하기 위해 Google과 통신할 수 있습니다.\n\n앱은 앱 전용 숨김 저장 영역을 위한 drive.appdata 권한을 요청하며, 일반 내 드라이브의 모든 파일에 접근하는 권한을 요청하지 않습니다. Google 사용자 데이터를 광고·마케팅·판매에 사용하지 않으며 Google API 사용자 데이터 정책과 적용되는 Limited Use 요건을 따릅니다.\n\n백업 성공 후 최신 정상 백업 5개를 남기도록 이전 정상 백업을 정리합니다. 오류나 미검증 파일 때문에 추가 사본이 남을 수 있으며 일정 기간 내 자동 삭제를 보장하지 않습니다.\n\nGoogle 개인정보 처리방침: https://policies.google.com/privacy\nGoogle API 사용자 데이터 정책: https://developers.google.com/terms/api-services-user-data-policy\n\n3. 이메일 문의와 외부 후원\n\n이메일 문의: 이메일 보내기를 선택하면 앱 버전·빌드 번호·실행 플랫폼·운영체제 버전이 메일 작성 화면에 전달됩니다. 이용자가 내용을 수정하고 발송 여부를 결정하며 기록·태그·계정 정보·백업 파일·장치 고유 식별자는 자동 첨부하지 않습니다. 메일 초안의 저장·동기화는 선택한 메일 서비스에 따릅니다. 주소 복사는 개발자 이메일 주소만 클립보드에 복사합니다.\n\n개발자는 실제 발송된 이메일의 발신 주소·이름·본문·첨부 정보를 문의 답변과 오류 조사에 사용하며 Gmail에서 직접 관리합니다. 문의 정보는 처리 완료 후 최대 6개월 보관한 뒤 삭제합니다. 삭제 요청 시에는 별도 법적 보존 의무가 없는 한 지체 없이 삭제합니다. Gmail에 남는 사본은 서비스 정책의 영향을 받을 수 있습니다.\n\n외부 후원: 후원 버튼은 외부 Ko-fi 페이지를 엽니다. 앱은 기록이나 계정 정보를 링크에 붙여 보내지 않으며 카드번호를 직접 받지 않습니다. 후원하지 않아도 앱 기능은 동일합니다. 후원 시 Ko-fi·결제 서비스에서 표시명·이메일·메시지·거래 정보 등이 개발자에게 제공될 수 있습니다. Ko-fi 운영자는 영국의 Ko-fi Labs Limited이며 결제는 별도 결제 서비스에서 처리합니다. 개발자는 후원 내역 확인을 위해 Ko-fi 화면에서만 후원 정보를 조회하며, 이를 내려받거나 별도의 파일·데이터베이스에 저장하지 않습니다. Ko-fi에 저장된 정보의 보관·삭제는 해당 서비스의 정책과 제공 기능에 따릅니다. 개발자의 조회·이용에 관한 문의나 삭제 요청은 아래 이메일로 접수할 수 있으며, 개발자가 처리할 수 있는 범위에서 조치하고 필요한 경우 Ko-fi의 절차를 안내합니다. Ko-fi에서 정보를 삭제해도 결제 서비스가 별도로 보관하는 거래 기록까지 함께 삭제되지는 않을 수 있습니다.\n\nKo-fi 개인정보 처리방침: https://more.ko-fi.com/privacy\nKo-fi 개인정보 문의: https://help.ko-fi.com/hc/en-us/requests/new\n\n4. 외부 서비스와 국외 처리\n\nGoogle 인증·Drive·Gmail, Ko-fi 및 이용자가 선택한 결제·메일·파일 저장 서비스는 서비스 제공에 필요한 정보와 접속·기술 정보를 처리할 수 있습니다. 이 과정에서 거주 국가 밖에서 정보가 처리될 수 있습니다. Drive에는 기록·태그·백업 정보가, 메일 서비스에는 작성하거나 발송한 문의 정보가 전달됩니다. 선택적 기능을 사용하지 않아도 기기 내 기록 기능은 이용할 수 있습니다.\n\nGoogle 서비스의 제공 법인은 이용자의 지역·계정에 적용되는 약관에 따라 달라집니다. 한국 기준 서비스 약관의 제공자는 미국의 Google LLC이며, EEA·스위스 이용자의 정보 처리 책임자는 일반적으로 Google Ireland Limited입니다. Google은 전 세계 서버에서 정보를 처리하고 정보 종류·설정·법적 필요에 따라 보관 기간과 삭제 절차를 달리 적용합니다. 이는 개발자가 문의를 보관하는 최대 6개월 기준과 별개입니다. Ko-fi 역시 국외 서비스 제공자에게 정보를 이전할 수 있습니다.\n\nGoogle 서비스 약관: https://policies.google.com/terms\nGoogle 보관·삭제 안내: https://policies.google.com/technologies/retention\nGoogle 개인정보 문의: https://support.google.com/policies/troubleshooter/2990837\n\n5. 삭제와 백업 관리\n\n- 기록·기기 데이터: 기록은 앱에서 조회·수정·삭제할 수 있습니다. 삭제한 기록도 과거 복구 사본이나 별도 백업에는 남을 수 있습니다. 기기 내부 데이터는 운영체제의 앱 데이터 제거 기능 등으로 관리할 수 있으며 앱 제거 후 복원 가능성은 운영체제에 따라 다릅니다.\n- 내보낸 파일: 전체 기록·태그가 담긴 백업 파일은 선택한 기기 폴더 또는 외부 저장 서비스에 저장됩니다. 해당 위치에서 직접 삭제해야 하며 앱 삭제로 자동 삭제되지 않습니다. 가져오기·복원은 현재 기록·태그를 전체 교체하며 복원 전 안전 사본이 남을 수 있습니다.\n- Google Drive: 앱의 계정 연결 해제는 로그아웃이며 Google 권한 철회나 원격 백업 삭제가 아닙니다. 권한은 Google 계정의 제3자 연결 관리에서 철회할 수 있습니다. 원격 백업을 개별 삭제하는 앱 화면은 없으며 Google Drive 웹 설정의 앱 관리에서 숨김 데이터를 삭제할 수 있습니다. 앱 제거만으로 Drive 백업이 삭제되지는 않습니다.\n\nGoogle 숨김 데이터 관리 안내: https://support.google.com/drive/answer/6374270?hl=ko\n\n6. 보안과 이용자의 권리\n\n앱은 기기 내 앱 전용 저장 영역을 사용하고 Drive 전송에는 HTTPS와 인증을 사용합니다. 백업 검증과 복원 전 확인 절차를 제공하지만 기록·설정·백업에 별도의 앱 자체 암호화나 비밀번호는 적용하지 않습니다. 기기와 계정을 보호하고 개인정보가 담긴 백업 파일을 신중하게 관리해 주십시오.\n\n개발자에게 제공한 정보의 열람·정정·삭제·처리정지는 아래 연락처로 요청할 수 있으며 권한 확인 후 적용 법령에 따라 처리합니다. 법정대리인도 해당 권리를 행사할 수 있습니다. 거주 지역에 따라 처리 제한·이의 제기·정보 이동·감독기관 불만 제기 권리가 인정될 수 있습니다. 동의에 근거한 처리의 동의는 철회할 수 있으며 철회 전 처리의 적법성에는 영향을 미치지 않습니다.\n\nGDPR이 적용되는 권리 요청에는 부당한 지체 없이 원칙적으로 접수 후 1개월 이내에 답변합니다. 복잡성이나 요청 수에 따라 필요한 경우 최대 2개월을 추가로 연장할 수 있으며, 이때 최초 1개월 안에 연장 사유를 안내합니다. 요청을 거절하는 경우에는 사유와 감독기관에 불만을 제기하는 방법을 안내합니다.\n\n개발자는 기기 내부나 개인 Drive의 기록을 원격으로 조회·삭제할 수 없습니다. 외부 서비스가 독립적으로 처리하는 정보는 해당 서비스의 관리 절차도 이용할 수 있습니다.\n\n7. 대상 이용자와 변경 안내\n\n앱은 일반 이용자를 위한 기록 도구이며 아동을 특별히 대상으로 하지 않습니다. 생년월일 수집이나 자체 연령 인증 기능은 없습니다. 이 설명은 스토어 연령 등급을 의미하지 않습니다.\n\n기능·처리 방식·법령이 변경되면 본 방침을 갱신하며 이용자의 권리에 중대한 영향을 주는 변경은 적용 법령에 따라 고지하고 필요한 동의를 받습니다.\n\n8. 운영자와 개인정보 문의\n\n앱 이름: HumanDrive\n운영자·개인정보 보호 담당자: 임수환 (Im Soohwan)\n이메일: imsoohwan.dev@gmail.com\n","en":"Effective date: October 21, 2026\n\nHumanDrive (the “app”) is a personal record management app operated by independent developer 임수환 (Im Soohwan). Records and settings are stored on your device by default and are not transmitted to a developer-operated server. There is no separate app registration. Google Drive backup, email inquiries, and external support payments are optional.\n\n1. Information stored on your device\n\nThe app stores the text of your records, tags, creation dates and times, selected reminder dates, and identifiers needed for storage and recovery. It uses this information to display, search, edit, and delete records. Language and animation settings are also stored on your device. Records may contain personal information that you enter yourself.\n\nRecords and settings are retained until you delete or change them, or remove the app’s data. Older recovery copies and copies created by the operating system’s backup or device transfer features may remain separately.\n\nThe app has no advertising, usage analytics, advertising identifier collection, or automatic remote error reporting features. Fonts are bundled with the app. External services’ own processing of connection and diagnostic information is governed by their policies.\n\n2. Optional Google Drive backup\n\nWhen you connect a Google account, the app uses your account identifier, email address, display name, and authentication permissions for backup and restore. Account display information and the time of the most recent backup are stored on your device. Disconnecting the account deletes its display information. A temporary authentication error alone does not delete existing display information. Authentication status and tokens are managed by the Google SDK and the operating system. The app does not persistently store tokens in its own files or backups.\n\nWhen you use backup, viewing, or restore features, all records and tags, the app version, and backup management information are transmitted directly between your device and Google Drive. They do not pass through a developer-operated server. Account information and authentication tokens are not included in backups. The Drive screen may communicate with Google to check the existing authentication status.\n\nThe app requests the drive.appdata permission for its own hidden storage area. It does not request permission to access all files in your regular My Drive. It does not use Google user data for advertising, marketing, or sale, and complies with the Google API Services User Data Policy and applicable Limited Use requirements.\n\nAfter a successful backup, the app cleans up older valid backups with the aim of retaining the five most recent valid backups. Additional copies may remain because of errors or unverified files. Automatic deletion within a specific period is not guaranteed.\n\nGoogle Privacy Policy: https://policies.google.com/privacy\nGoogle API Services User Data Policy: https://developers.google.com/terms/api-services-user-data-policy\n\n3. Email inquiries and external support payments\n\nEmail inquiries: When you select the option to send an email, the app version, build number, runtime platform, and operating system version are passed to the email composition screen. You can edit the contents and decide whether to send the email. Records, tags, account information, backup files, and unique device identifiers are not automatically attached. Saving and syncing email drafts depend on your chosen email service. Copying the address copies only the developer’s email address to the clipboard.\n\nThe developer uses the sender’s address and name, message body, and attachments in emails actually sent to respond to inquiries and investigate errors, and manages them directly in Gmail. Inquiry information is retained for no more than six months after the inquiry has been resolved, and is then deleted. If deletion is requested, it is deleted without delay unless a separate legal retention obligation applies. Copies remaining in Gmail may be subject to that service’s policies.\n\nExternal support payments: The support button opens an external Ko-fi page. The app does not append records or account information to the link and does not directly receive card numbers. App features are the same whether or not you provide financial support. When you provide support, Ko-fi or payment services may provide the developer with information such as your display name, email address, message, and transaction information. Ko-fi is operated by Ko-fi Labs Limited in the United Kingdom. Payments are processed by a separate payment service. The developer views support information only on Ko-fi to check support payments, and does not download it or store it in separate files or databases. Retention and deletion of information stored on Ko-fi are governed by that service’s policies and available features. Questions about the developer’s viewing or use of this information, and deletion requests, can be sent to the email address below. The developer will take action within the scope of what they can handle and, where necessary, explain Ko-fi’s procedures. Deleting information from Ko-fi may not also delete transaction records retained separately by payment services.\n\nKo-fi Privacy Policy: https://more.ko-fi.com/privacy\nKo-fi privacy inquiries: https://help.ko-fi.com/hc/en-us/requests/new\n\n4. External services and processing outside your country\n\nGoogle authentication, Drive, Gmail, Ko-fi, and the payment, email, and file storage services you choose may process information needed to provide their services, as well as connection and technical information. This may involve processing information outside your country of residence. Records, tags, and backup information are passed to Drive, while inquiry information you compose or send is passed to email services. You can use on-device record features without using the optional features.\n\nThe legal entity providing Google services depends on the terms applicable to your region and account. Under the terms of service for South Korea, the provider is Google LLC in the United States. For users in the EEA and Switzerland, the entity responsible for processing information is generally Google Ireland Limited. Google processes information on servers around the world, with different retention periods and deletion procedures depending on the information, settings, and legal needs. These are separate from the developer’s maximum six-month retention period for inquiries. Ko-fi may also transfer information to service providers outside your country.\n\nGoogle Terms of Service: https://policies.google.com/terms\nGoogle retention and deletion information: https://policies.google.com/technologies/retention\nGoogle privacy inquiries: https://support.google.com/policies/troubleshooter/2990837\n\n5. Deletion and backup management\n\n- Records and device data: You can view, edit, and delete records in the app. Deleted records may remain in older recovery copies or separate backups. You can manage on-device data using features such as the operating system’s app data removal function. Whether data can be restored after uninstalling the app depends on the operating system.\n- Exported files: Backup files containing all records and tags are stored in the device folder or external storage service you select. You must delete them directly from that location. Uninstalling the app does not automatically delete them. Import and restore replace all current records and tags. A pre-restore safety copy may remain.\n- Google Drive: Disconnecting an account in the app signs you out. It does not revoke Google permissions or delete remote backups. You can revoke permissions through third-party connection management in your Google account. The app has no screen for individually deleting remote backups. You can delete hidden data through Manage apps in Google Drive’s web settings. Uninstalling the app alone does not delete Drive backups.\n\nGoogle guidance on managing hidden data: https://support.google.com/drive/answer/6374270?hl=ko\n\n6. Security and your rights\n\nThe app uses app-specific storage on your device, and HTTPS and authentication for Drive transfers. It provides backup validation and pre-restore confirmation procedures, but does not apply separate app-level encryption or passwords to records, settings, or backups. Please protect your device and account, and carefully manage backup files containing personal information.\n\nYou can use the contact details below to request access to, correction or deletion of, or suspension of processing of information you have provided to the developer. Requests are handled in accordance with applicable law after verifying your authority to make the request. Legal representatives may also exercise applicable rights. Depending on your region, you may have rights to restriction of processing, objection, data portability, and lodging a complaint with a supervisory authority. You may withdraw consent for processing based on consent. Withdrawal does not affect the lawfulness of processing before withdrawal.\n\nFor rights requests covered by the GDPR, a response will be provided without undue delay and, in principle, within one month of receipt. Where necessary because of the complexity or number of requests, this period may be extended by up to two additional months. In that case, the reasons for the extension will be communicated within the initial month. If a request is refused, the reasons and how to lodge a complaint with a supervisory authority will be explained.\n\nThe developer cannot remotely view or delete records on your device or in your personal Drive. For information processed independently by external services, you can also use those services’ management procedures.\n\n7. Intended users and changes\n\nThe app is a record-keeping tool for general users and is not specifically directed at children. It does not collect dates of birth or provide its own age verification. This description does not indicate an app store age rating.\n\nThis policy will be updated when features, processing practices, or laws change. Changes materially affecting your rights will be notified in accordance with applicable law, and any necessary consent will be obtained.\n\n8. Operator and privacy inquiries\n\nApp name: HumanDrive\nOperator and person responsible for privacy: 임수환 (Im Soohwan)\nEmail: imsoohwan.dev@gmail.com\n","de":"Gültig ab: 21. Oktober 2026\n\nHumanDrive (im Folgenden „App“) ist eine App zur Verwaltung von Notizen, die vom unabhängigen Entwickler 임수환 (Im Soohwan) betrieben wird. Notizen und Einstellungen werden standardmäßig auf deinem Gerät gespeichert und nicht an einen Server des Entwicklers übertragen. Eine gesonderte Registrierung für ein App-Konto gibt es nicht. Google-Drive-Backups, Anfragen per E-Mail und finanzielle Unterstützung über externe Dienste sind freiwillig.\n\n1. Auf deinem Gerät gespeicherte Informationen\n\nDie App speichert den Text deiner Notizen, Schlagwörter, Erstellungsdatum und -uhrzeit, ausgewählte Erinnerungsdaten sowie Kennungen, die für Speicherung und Wiederherstellung benötigt werden. Diese Informationen werden zum Anzeigen, Suchen, Bearbeiten und Löschen von Notizen verwendet. Sprach- und Animationseinstellungen werden ebenfalls auf deinem Gerät gespeichert. Notizen können personenbezogene Daten enthalten, die du selbst eingibst.\n\nNotizen und Einstellungen bleiben gespeichert, bis du sie löschst oder änderst oder die App-Daten entfernst. Frühere Wiederherstellungskopien sowie Kopien aus Backup- oder Geräteübertragungsfunktionen des Betriebssystems können gesondert bestehen bleiben.\n\nDie App enthält keine Werbung, Nutzungsanalysen, Erfassung von Werbekennungen oder Funktionen zur automatischen Fernübermittlung von Fehlerberichten. Die Schriftarten sind in der App enthalten. Für die eigene Verarbeitung von Verbindungs- und Diagnosedaten durch externe Dienste gelten deren jeweilige Richtlinien.\n\n2. Freiwillige Google-Drive-Backups\n\nWenn du ein Google-Konto verbindest, verwendet die App die Kontokennung, E-Mail-Adresse, den Anzeigenamen und die Authentifizierungsberechtigungen für Backups und Wiederherstellungen. Die Anzeigeinformationen des Kontos und der Zeitpunkt des letzten Backups werden auf deinem Gerät gespeichert. Beim Trennen der Verbindung werden die Anzeigeinformationen gelöscht. Ein vorübergehender Authentifizierungsfehler allein führt nicht dazu, dass vorhandene Anzeigeinformationen gelöscht werden. Authentifizierungsstatus und Tokens werden vom Google SDK und vom Betriebssystem verwaltet. Die App speichert Tokens nicht dauerhaft in eigenen Dateien oder Backups.\n\nWenn du Backup-, Anzeige- oder Wiederherstellungsfunktionen nutzt, werden sämtliche Notizen und Schlagwörter, die App-Version und Informationen zur Backup-Verwaltung direkt zwischen deinem Gerät und Google Drive übertragen. Sie durchlaufen keinen Server des Entwicklers. Kontoinformationen und Authentifizierungstokens sind nicht in Backups enthalten. Der Drive-Bildschirm kann mit Google kommunizieren, um den bestehenden Authentifizierungsstatus zu prüfen.\n\nDie App fordert die Berechtigung drive.appdata für ihren eigenen verborgenen Speicherbereich an. Sie fordert keine Berechtigung zum Zugriff auf sämtliche Dateien in deiner regulären Ablage „Meine Ablage“ an. Google-Nutzerdaten werden nicht für Werbung, Marketing oder Verkauf verwendet. Die App hält die Google API Services User Data Policy und die jeweils anwendbaren Limited-Use-Anforderungen ein.\n\nNach einem erfolgreichen Backup bereinigt die App ältere gültige Backups mit dem Ziel, die fünf neuesten gültigen Backups zu behalten. Aufgrund von Fehlern oder ungeprüften Dateien können weitere Kopien bestehen bleiben. Eine automatische Löschung innerhalb eines bestimmten Zeitraums wird nicht garantiert.\n\nGoogle-Datenschutzerklärung: https://policies.google.com/privacy\nGoogle API Services User Data Policy: https://developers.google.com/terms/api-services-user-data-policy\n\n3. E-Mail-Anfragen und externe finanzielle Unterstützung\n\nE-Mail-Anfragen: Wenn du die Option zum Senden einer E-Mail auswählst, werden App-Version, Build-Nummer, Ausführungsplattform und Betriebssystemversion an das Fenster zum Verfassen der E-Mail übergeben. Du kannst den Inhalt ändern und selbst entscheiden, ob du die E-Mail sendest. Notizen, Schlagwörter, Kontoinformationen, Backup-Dateien und eindeutige Gerätekennungen werden nicht automatisch angehängt. Die Speicherung und Synchronisierung von E-Mail-Entwürfen richten sich nach dem ausgewählten E-Mail-Dienst. Die Funktion zum Kopieren der Adresse kopiert ausschließlich die E-Mail-Adresse des Entwicklers in die Zwischenablage.\n\nDer Entwickler verwendet Absenderadresse, Absendername, Nachrichtentext und Anhänge tatsächlich gesendeter E-Mails zur Beantwortung von Anfragen und zur Fehleruntersuchung und verwaltet sie direkt in Gmail. Informationen aus Anfragen werden nach Abschluss der Bearbeitung höchstens sechs Monate aufbewahrt und anschließend gelöscht. Bei einem Löschungsantrag werden sie unverzüglich gelöscht, sofern keine gesonderte gesetzliche Aufbewahrungspflicht besteht. In Gmail verbleibende Kopien können den Richtlinien dieses Dienstes unterliegen.\n\nExterne finanzielle Unterstützung: Die Unterstützungsschaltfläche öffnet eine externe Ko-fi-Seite. Die App hängt weder Notizen noch Kontoinformationen an den Link an und erhält keine Kartennummern direkt. Die App-Funktionen sind unabhängig davon gleich, ob du finanzielle Unterstützung leistest. Bei einer Unterstützung können Ko-fi oder Zahlungsdienste dem Entwickler Informationen wie Anzeigename, E-Mail-Adresse, Nachricht und Transaktionsinformationen übermitteln. Ko-fi wird von Ko-fi Labs Limited im Vereinigten Königreich betrieben; Zahlungen werden von einem gesonderten Zahlungsdienst verarbeitet. Der Entwickler sieht Unterstützungsinformationen ausschließlich auf der Ko-fi-Oberfläche ein, um Unterstützungszahlungen zu prüfen. Er lädt sie nicht herunter und speichert sie nicht in gesonderten Dateien oder Datenbanken. Die Aufbewahrung und Löschung der bei Ko-fi gespeicherten Informationen richten sich nach den Richtlinien und verfügbaren Funktionen dieses Dienstes. Fragen zur Einsichtnahme oder Verwendung dieser Informationen durch den Entwickler sowie Löschungsanträge können an die unten genannte E-Mail-Adresse gerichtet werden. Der Entwickler ergreift Maßnahmen im Rahmen seiner Handlungsmöglichkeiten und erläutert bei Bedarf die Verfahren von Ko-fi. Eine Löschung bei Ko-fi löscht möglicherweise nicht zugleich Transaktionsaufzeichnungen, die Zahlungsdienste gesondert aufbewahren.\n\nKo-fi-Datenschutzerklärung: https://more.ko-fi.com/privacy\nDatenschutzanfragen an Ko-fi: https://help.ko-fi.com/hc/en-us/requests/new\n\n4. Externe Dienste und Verarbeitung im Ausland\n\nDie Google-Authentifizierung, Drive, Gmail, Ko-fi sowie die von dir ausgewählten Zahlungs-, E-Mail- und Dateispeicherdienste können die zur Bereitstellung ihrer Dienste erforderlichen Informationen sowie Verbindungs- und technische Informationen verarbeiten. Dabei kann die Verarbeitung außerhalb deines Wohnsitzlandes stattfinden. Notizen, Schlagwörter und Backup-Informationen werden an Drive übermittelt; Informationen aus verfassten oder gesendeten Anfragen werden an E-Mail-Dienste weitergegeben. Die Funktionen für Notizen auf deinem Gerät kannst du auch ohne die freiwilligen Funktionen nutzen.\n\nWelche juristische Person die Google-Dienste bereitstellt, hängt von den für deine Region und dein Konto geltenden Nutzungsbedingungen ab. Nach den Nutzungsbedingungen für Südkorea ist Google LLC in den USA der Anbieter. Für Nutzer im Europäischen Wirtschaftsraum (EWR) und in der Schweiz ist in der Regel Google Ireland Limited für die Verarbeitung der Informationen verantwortlich. Google verarbeitet Informationen auf Servern weltweit und wendet je nach Art der Informationen, Einstellungen und rechtlicher Notwendigkeit unterschiedliche Aufbewahrungsfristen und Löschverfahren an. Diese sind von der höchstens sechsmonatigen Aufbewahrung von Anfragen durch den Entwickler zu unterscheiden. Auch Ko-fi kann Informationen an Dienstleister im Ausland übermitteln.\n\nGoogle-Nutzungsbedingungen: https://policies.google.com/terms\nInformationen zur Aufbewahrung und Löschung bei Google: https://policies.google.com/technologies/retention\nDatenschutzanfragen an Google: https://support.google.com/policies/troubleshooter/2990837\n\n5. Löschung und Backup-Verwaltung\n\n- Notizen und Gerätedaten: Du kannst Notizen in der App anzeigen, bearbeiten und löschen. Gelöschte Notizen können in früheren Wiederherstellungskopien oder gesonderten Backups verbleiben. Daten auf dem Gerät kannst du mit Funktionen wie dem Entfernen von App-Daten im Betriebssystem verwalten. Ob Daten nach der Deinstallation der App wiederhergestellt werden können, hängt vom Betriebssystem ab.\n- Exportierte Dateien: Backup-Dateien mit sämtlichen Notizen und Schlagwörtern werden im ausgewählten Geräteordner oder externen Speicherdienst gespeichert. Du musst sie dort direkt löschen; eine Deinstallation der App löscht sie nicht automatisch. Import und Wiederherstellung ersetzen sämtliche aktuellen Notizen und Schlagwörter. Eine vor der Wiederherstellung erstellte Sicherheitskopie kann bestehen bleiben.\n- Google Drive: Das Trennen der Kontoverbindung in der App meldet dich ab. Es widerruft weder Google-Berechtigungen noch löscht es entfernte Backups. Berechtigungen kannst du in der Verwaltung von Drittanbieterverbindungen deines Google-Kontos widerrufen. Die App bietet keinen Bildschirm zum einzelnen Löschen entfernter Backups. Verborgene Daten kannst du in der App-Verwaltung der Google-Drive-Webeinstellungen löschen. Die bloße Deinstallation der App löscht keine Drive-Backups.\n\nGoogle-Anleitung zur Verwaltung verborgener Daten: https://support.google.com/drive/answer/6374270?hl=ko\n\n6. Sicherheit und deine Rechte\n\nDie App verwendet einen eigenen Speicherbereich auf dem Gerät sowie HTTPS und Authentifizierung für Übertragungen mit Drive. Sie bietet eine Backup-Prüfung und eine Bestätigung vor der Wiederherstellung, wendet jedoch keine zusätzliche app-eigene Verschlüsselung oder Passwörter auf Notizen, Einstellungen oder Backups an. Schütze dein Gerät und dein Konto und gehe sorgfältig mit Backup-Dateien um, die personenbezogene Daten enthalten.\n\nÜber die unten genannten Kontaktdaten kannst du Auskunft, Berichtigung, Löschung oder Aussetzung der Verarbeitung von Informationen beantragen, die du dem Entwickler bereitgestellt hast. Nach Prüfung deiner Berechtigung werden Anträge gemäß dem anwendbaren Recht bearbeitet. Gesetzliche Vertreter können die jeweils bestehenden Rechte ebenfalls ausüben. Je nach Wohnsitzregion können dir Rechte auf Einschränkung der Verarbeitung, Widerspruch, Datenübertragbarkeit und Beschwerde bei einer Aufsichtsbehörde zustehen. Eine Einwilligung in eine darauf gestützte Verarbeitung kannst du widerrufen. Der Widerruf berührt nicht die Rechtmäßigkeit der Verarbeitung vor dem Widerruf.\n\nAnträge auf Ausübung von Rechten, die der DSGVO (GDPR) unterliegen, werden ohne unangemessene Verzögerung und grundsätzlich innerhalb eines Monats nach Eingang beantwortet. Soweit aufgrund der Komplexität oder Anzahl der Anträge erforderlich, kann diese Frist um höchstens zwei weitere Monate verlängert werden. In diesem Fall werden die Gründe innerhalb des ersten Monats mitgeteilt. Wird ein Antrag abgelehnt, werden die Gründe und die Möglichkeit einer Beschwerde bei einer Aufsichtsbehörde erläutert.\n\nDer Entwickler kann Notizen auf deinem Gerät oder in deinem persönlichen Drive nicht aus der Ferne einsehen oder löschen. Bei Informationen, die externe Dienste unabhängig verarbeiten, kannst du auch deren Verwaltungsverfahren nutzen.\n\n7. Zielgruppe und Änderungen\n\nDie App ist ein Notizwerkzeug für allgemeine Nutzer und richtet sich nicht speziell an Kinder. Sie erfasst keine Geburtsdaten und hat keine eigene Altersprüfung. Diese Beschreibung stellt keine Altersfreigabe eines App-Stores dar.\n\nDiese Erklärung wird bei Änderungen an Funktionen, Verarbeitungsweisen oder Gesetzen aktualisiert. Änderungen, die deine Rechte wesentlich betreffen, werden gemäß dem anwendbaren Recht mitgeteilt, und erforderliche Einwilligungen werden eingeholt.\n\n8. Betreiber und Datenschutzanfragen\n\nApp-Name: HumanDrive\nBetreiber und Ansprechpartner für den Datenschutz: 임수환 (Im Soohwan)\nE-Mail: imsoohwan.dev@gmail.com\n","es":"Fecha de entrada en vigor: 21 de octubre de 2026\n\nHumanDrive (en adelante, la «aplicación») es una aplicación de gestión de notas operada por el desarrollador independiente 임수환 (Im Soohwan). De forma predeterminada, las notas y los ajustes se guardan en tu dispositivo y no se transmiten a un servidor del desarrollador. No hay un registro de cuenta propio de la aplicación. Las copias de seguridad en Google Drive, las consultas por correo electrónico y las aportaciones económicas mediante servicios externos son opcionales.\n\n1. Información guardada en tu dispositivo\n\nLa aplicación guarda el texto de las notas, las etiquetas, la fecha y hora de creación, las fechas de recordatorio seleccionadas y los identificadores necesarios para el almacenamiento y la recuperación. Utiliza esta información para consultar, buscar, editar y eliminar notas. Los ajustes de idioma y animaciones también se guardan en tu dispositivo. Las notas pueden contener información personal que introduzcas por tu cuenta.\n\nLas notas y los ajustes se conservan hasta que los elimines o modifiques, o borres los datos de la aplicación. Pueden permanecer por separado copias anteriores de recuperación y copias generadas por las funciones de copia de seguridad o transferencia entre dispositivos del sistema operativo.\n\nLa aplicación no incluye publicidad, análisis de uso, recopilación de identificadores publicitarios ni informes automáticos de errores enviados a distancia. Las fuentes están incluidas en la aplicación. El tratamiento que los servicios externos hagan de sus propios datos de conexión y diagnóstico se rige por sus respectivas políticas.\n\n2. Copias de seguridad opcionales en Google Drive\n\nSi conectas una cuenta de Google, la aplicación utiliza el identificador de la cuenta, la dirección de correo electrónico, el nombre visible y los permisos de autenticación para las copias de seguridad y la restauración. La información de la cuenta que se muestra y la hora de la última copia de seguridad se guardan en tu dispositivo. Al desconectar la cuenta, se elimina su información de visualización. Un error temporal de autenticación no elimina por sí solo la información de visualización existente. El SDK de Google y el sistema operativo gestionan el estado de autenticación y los tokens. La aplicación no guarda tokens de forma permanente en sus propios archivos ni en las copias de seguridad.\n\nAl utilizar las funciones de copia de seguridad, consulta o restauración, todas las notas y etiquetas, la versión de la aplicación y la información de gestión de las copias se transmiten directamente entre tu dispositivo y Google Drive. No pasan por un servidor del desarrollador. La información de la cuenta y los tokens de autenticación no se incluyen en las copias. La pantalla de Drive puede comunicarse con Google para comprobar el estado de autenticación existente.\n\nLa aplicación solicita el permiso drive.appdata para su área de almacenamiento oculta y exclusiva. No solicita permiso para acceder a todos los archivos de tu sección habitual Mi unidad. No utiliza los datos de usuario de Google para publicidad, marketing ni venta, y cumple la Google API Services User Data Policy y los requisitos de Limited Use que resulten aplicables.\n\nTras una copia de seguridad correcta, la aplicación elimina copias válidas antiguas con el objetivo de conservar las cinco copias válidas más recientes. Los errores o los archivos sin verificar pueden hacer que queden copias adicionales. No se garantiza su eliminación automática dentro de un plazo concreto.\n\nPolítica de Privacidad de Google: https://policies.google.com/privacy\nGoogle API Services User Data Policy: https://developers.google.com/terms/api-services-user-data-policy\n\n3. Consultas por correo electrónico y aportaciones externas\n\nConsultas por correo electrónico: Al seleccionar la opción de enviar un correo, la versión de la aplicación, el número de compilación, la plataforma de ejecución y la versión del sistema operativo se transfieren a la pantalla de redacción del mensaje. Puedes modificar el contenido y decidir si lo envías. No se adjuntan automáticamente notas, etiquetas, información de la cuenta, archivos de copia de seguridad ni identificadores únicos del dispositivo. El almacenamiento y la sincronización de borradores dependen del servicio de correo que elijas. La función de copiar la dirección solo copia la dirección de correo del desarrollador al portapapeles.\n\nEl desarrollador utiliza la dirección y el nombre del remitente, el cuerpo del mensaje y los archivos adjuntos de los correos efectivamente enviados para responder consultas e investigar errores, y los gestiona directamente en Gmail. La información de las consultas se conserva durante un máximo de seis meses después de finalizar su tramitación y luego se elimina. Si solicitas su eliminación, se eliminará sin demora, salvo que exista una obligación legal específica de conservación. Las copias que permanezcan en Gmail pueden estar sujetas a las políticas de ese servicio.\n\nAportaciones externas: El botón de apoyo abre una página externa de Ko-fi. La aplicación no añade notas ni información de la cuenta al enlace y no recibe directamente números de tarjeta. Sus funciones son las mismas tanto si haces una aportación como si no. Al hacer una aportación, Ko-fi o los servicios de pago pueden facilitar al desarrollador datos como tu nombre visible, correo electrónico, mensaje e información de la transacción. Ko-fi está operado por Ko-fi Labs Limited, del Reino Unido, y los pagos los procesa un servicio de pago independiente. El desarrollador consulta la información de las aportaciones únicamente en la interfaz de Ko-fi para comprobarlas, sin descargarla ni guardarla en archivos o bases de datos separados. La conservación y eliminación de la información almacenada en Ko-fi se rigen por sus políticas y las funciones que ofrece. Puedes enviar al correo indicado más abajo consultas sobre el acceso o uso que hace el desarrollador de esa información, así como solicitudes de eliminación. El desarrollador actuará dentro de sus posibilidades de gestión y, cuando sea necesario, te indicará los procedimientos de Ko-fi. Eliminar información de Ko-fi puede no eliminar también los registros de transacciones que los servicios de pago conserven por separado.\n\nPolítica de privacidad de Ko-fi: https://more.ko-fi.com/privacy\nConsultas de privacidad a Ko-fi: https://help.ko-fi.com/hc/en-us/requests/new\n\n4. Servicios externos y tratamiento fuera de tu país\n\nLos servicios de autenticación de Google, Drive, Gmail, Ko-fi y los servicios de pago, correo y almacenamiento de archivos que elijas pueden tratar la información necesaria para prestar sus servicios, además de información técnica y de conexión. Esto puede implicar el tratamiento de información fuera de tu país de residencia. Las notas, etiquetas e información de las copias de seguridad se transfieren a Drive, mientras que la información de las consultas que redactes o envíes se transfiere a los servicios de correo. Puedes utilizar las funciones de notas en el dispositivo sin usar las funciones opcionales.\n\nLa entidad jurídica que presta los servicios de Google depende de las condiciones aplicables a tu región y cuenta. Según las condiciones de servicio para Corea del Sur, el proveedor es Google LLC, de Estados Unidos. Para los usuarios del Espacio Económico Europeo (EEE) y Suiza, el responsable del tratamiento de la información es, por lo general, Google Ireland Limited. Google trata información en servidores de todo el mundo y aplica distintos plazos de conservación y procedimientos de eliminación en función del tipo de información, los ajustes y las necesidades legales. Estos son independientes del plazo máximo de seis meses durante el que el desarrollador conserva las consultas. Ko-fi también puede transferir información a proveedores de servicios fuera de tu país.\n\nCondiciones del Servicio de Google: https://policies.google.com/terms\nInformación sobre conservación y eliminación de datos de Google: https://policies.google.com/technologies/retention\nConsultas de privacidad a Google: https://support.google.com/policies/troubleshooter/2990837\n\n5. Eliminación y gestión de copias de seguridad\n\n- Notas y datos del dispositivo: Puedes consultar, editar y eliminar notas en la aplicación. Las notas eliminadas pueden permanecer en copias anteriores de recuperación u otras copias de seguridad. Puedes gestionar los datos del dispositivo mediante funciones como la eliminación de datos de aplicaciones del sistema operativo. La posibilidad de restaurarlos después de desinstalar la aplicación depende del sistema operativo.\n- Archivos exportados: Los archivos de copia de seguridad que contienen todas las notas y etiquetas se guardan en la carpeta del dispositivo o el servicio de almacenamiento externo que selecciones. Debes eliminarlos directamente de esa ubicación; desinstalar la aplicación no los elimina automáticamente. La importación y la restauración sustituyen todas las notas y etiquetas actuales. Puede permanecer una copia de seguridad previa a la restauración.\n- Google Drive: Desconectar la cuenta en la aplicación cierra la sesión; no revoca los permisos de Google ni elimina las copias remotas. Puedes revocar los permisos en la gestión de conexiones con terceros de tu cuenta de Google. La aplicación no tiene una pantalla para eliminar copias remotas individualmente. Puedes eliminar los datos ocultos desde la gestión de aplicaciones en la configuración web de Google Drive. Desinstalar la aplicación por sí solo no elimina las copias de Drive.\n\nGuía de Google para gestionar datos ocultos: https://support.google.com/drive/answer/6374270?hl=ko\n\n6. Seguridad y tus derechos\n\nLa aplicación utiliza un área de almacenamiento exclusiva en el dispositivo, y HTTPS y autenticación para las transferencias con Drive. Ofrece verificación de copias de seguridad y confirmación antes de restaurar, pero no aplica cifrado ni contraseñas adicionales propios de la aplicación a las notas, los ajustes o las copias de seguridad. Protege tu dispositivo y tu cuenta, y gestiona con cuidado los archivos de copia de seguridad que contengan información personal.\n\nPuedes solicitar acceso, rectificación, eliminación o suspensión del tratamiento de la información que hayas proporcionado al desarrollador mediante el contacto indicado más abajo. Las solicitudes se tramitan conforme a la legislación aplicable, tras verificar que tienes autoridad para presentarlas. Los representantes legales también pueden ejercer los derechos que correspondan. Según tu región de residencia, puedes tener derechos de limitación del tratamiento, oposición, portabilidad de datos y reclamación ante una autoridad de control. Puedes retirar el consentimiento para los tratamientos basados en él, sin que ello afecte a la licitud del tratamiento anterior a su retirada.\n\nLas solicitudes de derechos sujetas al RGPD (GDPR) se responderán sin dilación indebida y, en principio, en el plazo de un mes desde su recepción. Si la complejidad o el número de solicitudes lo hacen necesario, el plazo podrá ampliarse hasta dos meses adicionales. En ese caso, se comunicarán los motivos de la ampliación dentro del primer mes. Si se rechaza una solicitud, se explicarán los motivos y la forma de reclamar ante una autoridad de control.\n\nEl desarrollador no puede consultar ni eliminar a distancia las notas de tu dispositivo o de tu Drive personal. Para la información tratada de forma independiente por servicios externos, también puedes utilizar sus respectivos procedimientos de gestión.\n\n7. Usuarios a los que se dirige y cambios\n\nLa aplicación es una herramienta de notas para el público general y no está dirigida específicamente a niños. No recopila fechas de nacimiento ni tiene una función propia de verificación de edad. Esta descripción no constituye una clasificación por edades de la tienda de aplicaciones.\n\nEsta política se actualizará cuando cambien las funciones, las prácticas de tratamiento o la legislación. Los cambios que afecten sustancialmente a tus derechos se notificarán de acuerdo con la legislación aplicable y se obtendrá el consentimiento necesario.\n\n8. Operador y consultas sobre privacidad\n\nNombre de la aplicación: HumanDrive\nOperador y responsable de privacidad: 임수환 (Im Soohwan)\nCorreo electrónico: imsoohwan.dev@gmail.com\n","ja":"施行日：2026年10月21日\n\nHumanDrive（以下「本アプリ」）は、個人開発者の임수환（Im Soohwan）が運営する記録管理アプリです。記録と設定は原則として端末内に保存され、開発者のサーバーには送信されません。本アプリ独自の会員登録はなく、Google Driveへのバックアップ、メールによるお問い合わせ、外部サービスでの支援は任意です。\n\n1. 端末に保存する情報\n\n本アプリは、記録の本文、タグ、作成日時、選択したリマインダー日付、および保存・復旧に必要な識別情報を保存し、記録の表示・検索・編集・削除に使用します。言語とアニメーションの設定も端末に保存します。記録には、利用者が自ら入力した個人情報が含まれる場合があります。\n\n記録と設定は、利用者が削除・変更するか、本アプリのデータを消去するまで保持されます。復旧用の過去のコピーや、OSのバックアップ・端末間移行機能によるコピーは、別途残る場合があります。\n\n本アプリには、広告、利用状況の分析、広告識別子の収集、自動的なリモートエラー報告の機能はありません。フォントは本アプリに同梱されています。外部サービスが独自に行う接続情報・診断情報の処理には、各サービスのポリシーが適用されます。\n\n2. 任意のGoogle Driveバックアップ\n\nGoogleアカウントを接続すると、アカウント識別子、メールアドレス、表示名、認証権限をバックアップと復元に使用します。アカウントの表示情報と直近のバックアップ時刻は端末に保存され、接続を解除すると表示情報を削除します。一時的な認証エラーだけで既存の表示情報が削除されることはありません。認証状態とトークンはGoogle SDKとOSが管理し、本アプリは独自のファイルやバックアップにトークンを永続保存しません。\n\nバックアップ・表示・復元の機能を利用すると、すべての記録とタグ、アプリのバージョン、バックアップ管理情報が端末とGoogle Driveの間で直接送受信されます。開発者のサーバーは経由せず、アカウント情報と認証トークンはバックアップに含まれません。Drive画面では、既存の認証状態を確認するためにGoogleと通信する場合があります。\n\n本アプリは、アプリ専用の非表示の保存領域を利用するためのdrive.appdata権限を要求します。通常のマイドライブにあるすべてのファイルにアクセスする権限は要求しません。Googleユーザーデータを広告・マーケティング・販売に使用せず、Google API Services User Data Policyと、適用されるLimited Use要件に従います。\n\nバックアップが成功すると、最新の正常なバックアップ5件を残すように、古い正常なバックアップを整理します。エラーや未検証のファイルにより、それ以外のコピーが残る場合があり、一定期間内の自動削除は保証しません。\n\nGoogleプライバシーポリシー：https://policies.google.com/privacy\nGoogle API Services User Data Policy：https://developers.google.com/terms/api-services-user-data-policy\n\n3. メールでのお問い合わせと外部サービスでの支援\n\nメールでのお問い合わせ：メール送信の操作を選択すると、アプリのバージョン、ビルド番号、実行プラットフォーム、OSのバージョンがメール作成画面に渡されます。利用者は内容を編集し、送信するかどうかを決めることができます。記録、タグ、アカウント情報、バックアップファイル、端末固有の識別子が自動添付されることはありません。メールの下書きの保存・同期は、選択したメールサービスに従います。アドレスのコピーでは、開発者のメールアドレスだけをクリップボードにコピーします。\n\n開発者は、実際に送信されたメールの送信元アドレス・氏名・本文・添付情報を、お問い合わせへの回答とエラー調査に使用し、Gmailで直接管理します。お問い合わせ情報は対応完了後、最長6か月保管してから削除します。削除の依頼があった場合は、別途法令上の保存義務がない限り、遅滞なく削除します。Gmailに残るコピーは、同サービスのポリシーの影響を受ける場合があります。\n\n外部サービスでの支援：支援ボタンを押すと、外部のKo-fiページが開きます。本アプリはリンクに記録やアカウント情報を付加して送信せず、カード番号を直接受け取りません。支援の有無によるアプリ機能の違いはありません。支援を行うと、Ko-fiや決済サービスから、表示名、メールアドレス、メッセージ、取引情報などが開発者に提供される場合があります。Ko-fiの運営者は英国のKo-fi Labs Limitedで、決済は別の決済サービスが処理します。開発者は支援履歴を確認する目的でKo-fiの画面上でのみ支援情報を閲覧し、ダウンロードしたり、別のファイルやデータベースに保存したりしません。Ko-fiに保存された情報の保管・削除は、同サービスのポリシーと提供機能に従います。開発者による閲覧・利用についてのお問い合わせや削除依頼は、下記のメールアドレスで受け付けます。開発者が対応できる範囲で措置を行い、必要に応じてKo-fiの手続きをご案内します。Ko-fiで情報を削除しても、決済サービスが別途保管する取引記録までは削除されない場合があります。\n\nKo-fiプライバシーポリシー：https://more.ko-fi.com/privacy\nKo-fiの個人情報に関するお問い合わせ：https://help.ko-fi.com/hc/en-us/requests/new\n\n4. 外部サービスと国外での処理\n\nGoogleの認証・Drive・Gmail、Ko-fi、および利用者が選択する決済・メール・ファイル保存サービスは、サービス提供に必要な情報と接続・技術情報を処理する場合があります。その過程で、居住国の国外で情報が処理される場合があります。Driveには記録・タグ・バックアップ情報が、メールサービスには作成または送信したお問い合わせ情報が渡されます。任意の機能を利用しなくても、端末内で記録を管理する機能は利用できます。\n\nGoogleサービスの提供法人は、利用者の地域・アカウントに適用される利用規約によって異なります。韓国向け利用規約での提供者は米国のGoogle LLCで、EEA・スイスの利用者の情報処理責任者は通常Google Ireland Limitedです。Googleは世界各地のサーバーで情報を処理し、情報の種類・設定・法的必要性によって、異なる保管期間と削除手続きを適用します。これは、開発者がお問い合わせを保管する最長6か月の基準とは別です。Ko-fiも国外のサービス提供者に情報を移転する場合があります。\n\nGoogle利用規約：https://policies.google.com/terms\nGoogleの保管・削除に関する案内：https://policies.google.com/technologies/retention\nGoogleの個人情報に関するお問い合わせ：https://support.google.com/policies/troubleshooter/2990837\n\n5. 削除とバックアップの管理\n\n- 記録・端末データ：記録は本アプリで表示・編集・削除できます。削除した記録も、過去の復旧用コピーや別のバックアップには残る場合があります。端末内のデータは、OSのアプリデータ消去機能などで管理できます。アプリのアンインストール後に復元できるかどうかはOSによって異なります。\n- エクスポートしたファイル：すべての記録・タグを含むバックアップファイルは、選択した端末内のフォルダまたは外部ストレージサービスに保存されます。その保存先から直接削除する必要があり、本アプリのアンインストールによって自動削除されることはありません。インポート・復元は現在の記録・タグをすべて置き換えます。復元前の安全用コピーが残る場合があります。\n- Google Drive：本アプリでのアカウント接続の解除はログアウトであり、Googleの権限の取り消しやリモートバックアップの削除ではありません。権限はGoogleアカウントのサードパーティ接続管理で取り消すことができます。リモートバックアップを個別に削除するアプリ画面はありません。Google Driveのウェブ設定のアプリ管理で、非表示のデータを削除できます。本アプリをアンインストールするだけでは、Driveのバックアップは削除されません。\n\nGoogleの非表示データ管理に関する案内：https://support.google.com/drive/answer/6374270?hl=ko\n\n6. セキュリティと利用者の権利\n\n本アプリは端末内のアプリ専用保存領域を使用し、Driveとの送受信にはHTTPSと認証を使用します。バックアップの検証と復元前の確認手続きを提供しますが、記録・設定・バックアップに、別途アプリ独自の暗号化やパスワードは適用しません。端末とアカウントを保護し、個人情報を含むバックアップファイルは慎重に管理してください。\n\n開発者に提供した情報の閲覧・訂正・削除・処理停止は、下記の連絡先に依頼できます。依頼する権限を確認したうえで、適用法令に従って対応します。法定代理人も、認められる権利を行使できます。居住地域によっては、処理の制限、異議申し立て、データポータビリティ、監督機関への苦情申し立ての権利が認められる場合があります。同意を根拠とする処理については同意を撤回でき、撤回前の処理の適法性には影響しません。\n\nGDPRが適用される権利行使の依頼には、不当な遅滞なく、原則として受付後1か月以内に回答します。依頼の複雑さや件数に応じて必要な場合は、さらに最長2か月延長することがあります。その場合は、最初の1か月以内に延長理由をお知らせします。依頼を拒否する場合は、その理由と監督機関への苦情申し立て方法をご案内します。\n\n開発者は、端末内や個人のDriveの記録を遠隔で閲覧・削除できません。外部サービスが独立して処理する情報については、同サービスの管理手続きも利用できます。\n\n7. 対象利用者と変更のお知らせ\n\n本アプリは一般の利用者向けの記録ツールであり、特に児童を対象としたものではありません。生年月日の収集や独自の年齢確認機能はありません。この説明は、アプリストアの年齢レーティングを示すものではありません。\n\n機能・処理方法・法令の変更に応じて本ポリシーを更新します。利用者の権利に重大な影響を及ぼす変更は、適用法令に従ってお知らせし、必要な同意を取得します。\n\n8. 運営者と個人情報に関するお問い合わせ\n\nアプリ名：HumanDrive\n運営者・個人情報保護担当者：임수환（Im Soohwan）\nメール：imsoohwan.dev@gmail.com\n","zh-Hans":"生效日期：2026年10月21日\n\nHumanDrive（以下简称“本应用”）是由独立开发者임수환（Im Soohwan）运营的记录管理应用。记录和设置默认保存在设备上，不会传输至开发者的服务器。本应用无需单独注册账号。Google Drive 备份、电子邮件咨询以及通过外部服务提供赞助均为可选功能。\n\n1. 保存在设备上的信息\n\n本应用保存记录正文、标签、创建日期和时间、所选提醒日期，以及存储和恢复所需的标识信息，用于查看、搜索、编辑和删除记录。语言和动画设置也保存在设备上。记录可能包含用户自行输入的个人信息。\n\n记录和设置会保留至用户将其删除、更改或清除应用数据为止。用于恢复的旧副本，以及操作系统备份或设备迁移功能生成的副本，可能另外留存。\n\n本应用没有广告、使用情况分析、广告标识符收集或自动远程错误报告功能。字体随应用一同提供。外部服务自行处理连接信息和诊断信息时，适用其各自的政策。\n\n2. 可选的 Google Drive 备份\n\n连接 Google 账号后，本应用会将账号标识符、电子邮件地址、显示名称和身份验证权限用于备份及恢复。账号显示信息和最近一次备份时间保存在设备上，断开连接时会删除显示信息。临时身份验证错误本身不会导致现有显示信息被删除。身份验证状态和令牌由 Google SDK 及操作系统管理，本应用不会在自己的文件或备份中持久保存令牌。\n\n使用备份、查看或恢复功能时，全部记录和标签、应用版本及备份管理信息会在设备与 Google Drive 之间直接传输，不经过开发者的服务器。备份不包含账号信息或身份验证令牌。Drive 页面可能会与 Google 通信，以检查现有身份验证状态。\n\n本应用请求 drive.appdata 权限，用于访问应用专用的隐藏存储区域，不会请求访问常规“我的云端硬盘”中所有文件的权限。本应用不将 Google 用户数据用于广告、营销或出售，并遵守 Google API Services User Data Policy 及适用的 Limited Use 要求。\n\n备份成功后，本应用会清理较早的有效备份，以保留最近的5份有效备份。由于错误或未经验证的文件，可能仍有额外副本留存；本应用不保证在特定期限内自动删除这些副本。\n\nGoogle 隐私政策：https://policies.google.com/privacy\nGoogle API Services User Data Policy：https://developers.google.com/terms/api-services-user-data-policy\n\n3. 电子邮件咨询与外部赞助\n\n电子邮件咨询：选择发送电子邮件后，应用版本、构建编号、运行平台和操作系统版本会传递至邮件撰写界面。用户可以修改内容，并自行决定是否发送。记录、标签、账号信息、备份文件和设备唯一标识符不会自动附加。邮件草稿的保存与同步取决于所选邮件服务。复制地址功能仅将开发者的电子邮件地址复制到剪贴板。\n\n开发者使用实际收到的邮件中的发件地址、姓名、正文及附件信息来回复咨询和调查错误，并直接在 Gmail 中管理。咨询信息在处理完成后最多保留6个月，随后删除。收到删除请求时，除非另有法定保留义务，否则会及时删除。Gmail 中留存的副本可能受该服务政策的影响。\n\n外部赞助：赞助按钮会打开外部 Ko-fi 页面。本应用不会将记录或账号信息附加到链接中发送，也不会直接接收银行卡号。无论是否赞助，应用功能均相同。赞助时，Ko-fi 或支付服务可能向开发者提供显示名称、电子邮件地址、留言和交易信息等。Ko-fi 的运营方是英国的 Ko-fi Labs Limited，付款由单独的支付服务处理。开发者仅在 Ko-fi 界面上查看赞助信息以核对赞助记录，不会下载这些信息，也不会将其保存到单独的文件或数据库中。Ko-fi 所存储信息的保留与删除遵循该服务的政策及所提供的功能。对于开发者查看、使用信息的咨询或删除请求，可以发送至下方电子邮件地址。开发者会在能够处理的范围内采取措施，必要时说明 Ko-fi 的相关流程。在 Ko-fi 删除信息，并不一定会同时删除支付服务另外保存的交易记录。\n\nKo-fi 隐私政策：https://more.ko-fi.com/privacy\nKo-fi 隐私咨询：https://help.ko-fi.com/hc/en-us/requests/new\n\n4. 外部服务与境外处理\n\nGoogle 身份验证、Drive、Gmail、Ko-fi，以及用户选择的支付、邮件和文件存储服务，可能会处理提供服务所需的信息、连接信息和技术信息。在此过程中，信息可能在用户居住国家以外处理。记录、标签和备份信息会传递至 Drive；撰写或发送的咨询信息会传递至邮件服务。即使不使用可选功能，仍可使用设备本地的记录功能。\n\nGoogle 服务的提供实体取决于用户所在地区及账号所适用的条款。根据面向韩国的服务条款，提供方是美国的 Google LLC；欧洲经济区（EEA）及瑞士用户的信息处理责任方通常为 Google Ireland Limited。Google 在全球各地的服务器上处理信息，并根据信息类型、设置和法律需要采用不同的保留期限和删除流程。这与开发者最多保留咨询信息6个月的标准相互独立。Ko-fi 也可能将信息传输给境外服务提供方。\n\nGoogle 服务条款：https://policies.google.com/terms\nGoogle 信息保留与删除说明：https://policies.google.com/technologies/retention\nGoogle 隐私咨询：https://support.google.com/policies/troubleshooter/2990837\n\n5. 删除与备份管理\n\n- 记录及设备数据：用户可以在应用中查看、编辑和删除记录。已删除的记录仍可能保留在旧的恢复副本或其他备份中。设备内的数据可通过操作系统的应用数据清除等功能管理。卸载应用后是否可以恢复数据，取决于操作系统。\n- 导出的文件：包含全部记录和标签的备份文件保存在所选设备文件夹或外部存储服务中。用户需要在相应位置直接删除，卸载应用不会自动将其删除。导入或恢复会完全替换当前记录和标签，恢复前的安全副本可能仍会留存。\n- Google Drive：在应用中断开账号连接只会退出登录，不会撤销 Google 权限或删除远程备份。用户可以在 Google 账号的第三方连接管理中撤销权限。本应用没有单独删除远程备份的页面。用户可以通过 Google Drive 网页版设置中的应用管理删除隐藏数据。仅卸载应用不会删除 Drive 备份。\n\nGoogle 隐藏数据管理说明：https://support.google.com/drive/answer/6374270?hl=ko\n\n6. 安全与用户权利\n\n本应用使用设备上的应用专用存储区域，与 Drive 之间的传输使用 HTTPS 和身份验证。本应用提供备份验证及恢复前确认流程，但不会对记录、设置或备份额外实施应用自身的加密或密码保护。请保护好设备和账号，并谨慎管理包含个人信息的备份文件。\n\n用户可以通过下方联系方式请求查阅、更正、删除或停止处理已向开发者提供的信息。开发者会确认请求人的相关权限，并依据适用法律处理。法定代理人也可以行使适用的权利。根据居住地区，用户可能享有限制处理、提出异议、数据可携带以及向监管机构投诉的权利。对于基于同意的处理，用户可以撤回同意，撤回不会影响撤回前处理的合法性。\n\n对于适用 GDPR 的权利请求，将在无不当延迟的情况下，原则上自收到请求之日起1个月内答复。因请求的复杂程度或数量而有必要时，可额外延长最多2个月，并在最初的1个月内告知延长理由。如果拒绝请求，将说明理由及向监管机构投诉的方法。\n\n开发者无法远程查看或删除设备内部或用户个人 Drive 中的记录。对于外部服务独立处理的信息，用户也可以使用相应服务的管理流程。\n\n7. 适用用户与变更通知\n\n本应用是面向普通用户的记录工具，并非专门面向儿童。本应用不收集出生日期，也没有自己的年龄验证功能。此说明不代表应用商店的年龄分级。\n\n功能、处理方式或法律发生变化时，将更新本政策。对于重大影响用户权利的变更，将依照适用法律通知用户，并取得必要的同意。\n\n8. 运营方与隐私咨询\n\n应用名称：HumanDrive\n运营方及个人信息保护负责人：임수환（Im Soohwan）\n电子邮件：imsoohwan.dev@gmail.com\n","pt-BR":"Data de vigência: 21 de outubro de 2026\n\nHumanDrive (doravante, o “aplicativo”) é um aplicativo de gerenciamento de notas operado pelo desenvolvedor independente 임수환 (Im Soohwan). Por padrão, as notas e as configurações são salvas no seu dispositivo e não são transmitidas a um servidor do desenvolvedor. Não há cadastro de conta próprio do aplicativo. O backup no Google Drive, as consultas por e-mail e o apoio financeiro por serviços externos são opcionais.\n\n1. Informações salvas no seu dispositivo\n\nO aplicativo salva o texto das notas, as etiquetas, as datas e os horários de criação, as datas de lembrete selecionadas e os identificadores necessários para armazenamento e recuperação. Essas informações são usadas para visualizar, pesquisar, editar e excluir notas. As configurações de idioma e animação também são salvas no dispositivo. As notas podem conter informações pessoais que você inserir por conta própria.\n\nAs notas e as configurações são mantidas até que você as exclua ou altere, ou remova os dados do aplicativo. Cópias antigas de recuperação e cópias criadas pelos recursos de backup ou transferência entre dispositivos do sistema operacional podem permanecer separadamente.\n\nO aplicativo não contém publicidade, análise de uso, coleta de identificadores de publicidade nem recursos de envio automático de relatórios de erros à distância. As fontes estão incluídas no aplicativo. O tratamento de informações de conexão e diagnóstico realizado pelos próprios serviços externos segue as políticas desses serviços.\n\n2. Backup opcional no Google Drive\n\nAo conectar uma conta Google, o aplicativo usa o identificador da conta, o endereço de e-mail, o nome de exibição e as permissões de autenticação para backup e restauração. As informações de exibição da conta e o horário do backup mais recente são salvos no dispositivo. Ao desconectar a conta, as informações de exibição são excluídas. Um erro temporário de autenticação, por si só, não exclui as informações de exibição existentes. O estado de autenticação e os tokens são gerenciados pelo SDK do Google e pelo sistema operacional. O aplicativo não armazena tokens permanentemente em seus próprios arquivos ou backups.\n\nAo usar os recursos de backup, consulta ou restauração, todas as notas e etiquetas, a versão do aplicativo e as informações de gerenciamento de backup são transmitidas diretamente entre o dispositivo e o Google Drive. Elas não passam por um servidor do desenvolvedor. As informações da conta e os tokens de autenticação não são incluídos nos backups. A tela do Drive pode se comunicar com o Google para verificar o estado de autenticação existente.\n\nO aplicativo solicita a permissão drive.appdata para sua área de armazenamento oculta e exclusiva. Ele não solicita permissão para acessar todos os arquivos do seu Meu Drive comum. Os dados de usuários do Google não são usados para publicidade, marketing ou venda, e o aplicativo segue a Google API Services User Data Policy e os requisitos de Limited Use aplicáveis.\n\nApós um backup bem-sucedido, o aplicativo remove backups válidos mais antigos com o objetivo de manter os cinco backups válidos mais recentes. Erros ou arquivos não verificados podem fazer com que cópias adicionais permaneçam. Não há garantia de exclusão automática dentro de um prazo específico.\n\nPolítica de Privacidade do Google: https://policies.google.com/privacy\nGoogle API Services User Data Policy: https://developers.google.com/terms/api-services-user-data-policy\n\n3. Consultas por e-mail e apoio financeiro externo\n\nConsultas por e-mail: Ao selecionar a opção de enviar um e-mail, a versão do aplicativo, o número da compilação, a plataforma de execução e a versão do sistema operacional são enviados à tela de composição da mensagem. Você pode editar o conteúdo e decidir se deseja enviar o e-mail. Notas, etiquetas, informações da conta, arquivos de backup e identificadores únicos do dispositivo não são anexados automaticamente. O armazenamento e a sincronização de rascunhos dependem do serviço de e-mail escolhido. A função de copiar o endereço copia apenas o endereço de e-mail do desenvolvedor para a área de transferência.\n\nO desenvolvedor usa o endereço e o nome do remetente, o corpo da mensagem e os anexos dos e-mails efetivamente enviados para responder às consultas e investigar erros, gerenciando essas informações diretamente no Gmail. As informações das consultas são mantidas por, no máximo, seis meses após a conclusão do atendimento e, depois, excluídas. Se houver uma solicitação de exclusão, elas serão excluídas sem demora, salvo quando existir uma obrigação legal específica de retenção. As cópias que permanecerem no Gmail poderão estar sujeitas às políticas desse serviço.\n\nApoio financeiro externo: O botão de apoio abre uma página externa do Ko-fi. O aplicativo não adiciona notas ou informações da conta ao link e não recebe números de cartão diretamente. As funcionalidades são as mesmas, independentemente de você oferecer apoio financeiro. Ao oferecer apoio, o Ko-fi ou os serviços de pagamento podem fornecer ao desenvolvedor informações como nome de exibição, e-mail, mensagem e dados da transação. O Ko-fi é operado pela Ko-fi Labs Limited, do Reino Unido, e os pagamentos são processados por um serviço de pagamento separado. O desenvolvedor consulta as informações de apoio somente na interface do Ko-fi para conferir as contribuições, sem baixá-las nem salvá-las em arquivos ou bancos de dados separados. A retenção e a exclusão das informações armazenadas no Ko-fi seguem as políticas e os recursos disponíveis desse serviço. Dúvidas sobre a consulta ou o uso dessas informações pelo desenvolvedor, assim como solicitações de exclusão, podem ser enviadas ao e-mail abaixo. O desenvolvedor tomará as medidas que estiverem ao seu alcance e, quando necessário, explicará os procedimentos do Ko-fi. A exclusão de informações no Ko-fi pode não excluir também os registros de transações mantidos separadamente pelos serviços de pagamento.\n\nPolítica de privacidade do Ko-fi: https://more.ko-fi.com/privacy\nConsultas sobre privacidade ao Ko-fi: https://help.ko-fi.com/hc/en-us/requests/new\n\n4. Serviços externos e tratamento fora do seu país\n\nA autenticação do Google, o Drive, o Gmail, o Ko-fi e os serviços de pagamento, e-mail e armazenamento de arquivos que você escolher podem tratar as informações necessárias à prestação de seus serviços, além de informações técnicas e de conexão. Nesse processo, as informações podem ser tratadas fora do seu país de residência. Notas, etiquetas e informações de backup são enviadas ao Drive; as informações das consultas que você redigir ou enviar são transmitidas aos serviços de e-mail. Você pode usar os recursos de notas no dispositivo sem utilizar os recursos opcionais.\n\nA pessoa jurídica que fornece os serviços do Google depende dos termos aplicáveis à sua região e conta. Segundo os termos de serviço para a Coreia do Sul, a fornecedora é a Google LLC, dos Estados Unidos. Para usuários do Espaço Econômico Europeu (EEE) e da Suíça, a responsável pelo tratamento das informações geralmente é a Google Ireland Limited. O Google trata informações em servidores ao redor do mundo e aplica prazos de retenção e procedimentos de exclusão diferentes conforme o tipo de informação, as configurações e as necessidades legais. Esses critérios são independentes do prazo máximo de seis meses durante o qual o desenvolvedor mantém as consultas. O Ko-fi também pode transferir informações para prestadores de serviços fora do seu país.\n\nTermos de Serviço do Google: https://policies.google.com/terms\nInformações sobre retenção e exclusão de dados pelo Google: https://policies.google.com/technologies/retention\nConsultas sobre privacidade ao Google: https://support.google.com/policies/troubleshooter/2990837\n\n5. Exclusão e gerenciamento de backups\n\n- Notas e dados do dispositivo: Você pode visualizar, editar e excluir notas no aplicativo. As notas excluídas podem permanecer em cópias antigas de recuperação ou em backups separados. Os dados no dispositivo podem ser gerenciados por recursos como a remoção dos dados do aplicativo pelo sistema operacional. A possibilidade de restauração após desinstalar o aplicativo depende do sistema operacional.\n- Arquivos exportados: Os arquivos de backup com todas as notas e etiquetas são salvos na pasta do dispositivo ou no serviço de armazenamento externo escolhido. Você deve excluí-los diretamente desse local; a desinstalação do aplicativo não os exclui automaticamente. A importação e a restauração substituem todas as notas e etiquetas atuais. Uma cópia de segurança anterior à restauração pode permanecer.\n- Google Drive: Desconectar a conta no aplicativo encerra a sessão; isso não revoga as permissões do Google nem exclui os backups remotos. Você pode revogar as permissões no gerenciamento de conexões com terceiros da sua conta Google. O aplicativo não tem uma tela para excluir backups remotos individualmente. Você pode excluir os dados ocultos pelo gerenciamento de aplicativos nas configurações da versão web do Google Drive. Apenas desinstalar o aplicativo não exclui os backups do Drive.\n\nOrientações do Google sobre gerenciamento de dados ocultos: https://support.google.com/drive/answer/6374270?hl=ko\n\n6. Segurança e seus direitos\n\nO aplicativo usa uma área de armazenamento exclusiva no dispositivo e utiliza HTTPS e autenticação nas transferências com o Drive. Ele oferece verificação de backups e confirmação antes da restauração, mas não aplica criptografia ou senhas adicionais próprias do aplicativo às notas, configurações ou backups. Proteja seu dispositivo e sua conta e gerencie com cuidado os arquivos de backup que contenham informações pessoais.\n\nVocê pode usar o contato abaixo para solicitar acesso, correção, exclusão ou suspensão do tratamento das informações fornecidas ao desenvolvedor. As solicitações são atendidas conforme a legislação aplicável, após a verificação de que você tem legitimidade para fazê-las. Representantes legais também podem exercer os direitos cabíveis. Dependendo da sua região de residência, você pode ter direitos à limitação do tratamento, à oposição, à portabilidade dos dados e à apresentação de reclamações a uma autoridade de controle. Você pode revogar o consentimento para tratamentos baseados nele, sem afetar a licitude do tratamento realizado antes da revogação.\n\nAs solicitações de exercício de direitos sujeitas ao GDPR serão respondidas sem demora indevida e, em princípio, em até um mês após o recebimento. Quando necessário devido à complexidade ou à quantidade de solicitações, esse prazo poderá ser prorrogado por até dois meses adicionais. Nesse caso, os motivos da prorrogação serão informados dentro do primeiro mês. Se uma solicitação for recusada, serão explicados os motivos e a forma de apresentar uma reclamação a uma autoridade de controle.\n\nO desenvolvedor não pode visualizar ou excluir remotamente as notas no seu dispositivo ou no seu Drive pessoal. Para informações tratadas de forma independente por serviços externos, você também pode usar os procedimentos de gerenciamento desses serviços.\n\n7. Público-alvo e alterações\n\nO aplicativo é uma ferramenta de notas para o público em geral e não é direcionado especificamente a crianças. Ele não coleta datas de nascimento nem tem um recurso próprio de verificação de idade. Essa descrição não representa a classificação etária da loja de aplicativos.\n\nEsta política será atualizada quando houver mudanças nas funcionalidades, nas práticas de tratamento ou na legislação. As alterações que afetem significativamente seus direitos serão comunicadas conforme a legislação aplicável, e os consentimentos necessários serão obtidos.\n\n8. Operador e consultas sobre privacidade\n\nNome do aplicativo: HumanDrive\nOperador e responsável pela proteção de informações pessoais: 임수환 (Im Soohwan)\nE-mail: imsoohwan.dev@gmail.com\n","fr":"Date d’entrée en vigueur : 21 octobre 2026\n\nHumanDrive (ci-après l’« application ») est une application de gestion de notes exploitée par le développeur indépendant 임수환 (Im Soohwan). Les notes et les paramètres sont enregistrés par défaut sur votre appareil et ne sont pas transmis à un serveur du développeur. L’application ne nécessite pas la création d’un compte propre. La sauvegarde sur Google Drive, les demandes par e-mail et le soutien financier via des services externes sont facultatifs.\n\n1. Informations enregistrées sur votre appareil\n\nL’application enregistre le texte des notes, les étiquettes, les dates et heures de création, les dates de rappel choisies ainsi que les identifiants nécessaires au stockage et à la récupération. Elle utilise ces informations pour consulter, rechercher, modifier et supprimer les notes. Les paramètres de langue et d’animation sont également enregistrés sur votre appareil. Les notes peuvent contenir des informations personnelles que vous saisissez vous-même.\n\nLes notes et les paramètres sont conservés jusqu’à ce que vous les supprimiez ou les modifiiez, ou que vous effaciez les données de l’application. D’anciennes copies de récupération ainsi que des copies créées par les fonctions de sauvegarde ou de transfert d’appareil du système d’exploitation peuvent subsister séparément.\n\nL’application ne comporte aucune publicité, analyse de l’utilisation, collecte d’identifiants publicitaires ni fonction de signalement automatique d’erreurs à distance. Les polices sont incluses dans l’application. Le traitement par les services externes de leurs propres informations de connexion et de diagnostic relève de leurs politiques respectives.\n\n2. Sauvegarde facultative sur Google Drive\n\nLorsque vous connectez un compte Google, l’application utilise l’identifiant du compte, l’adresse e-mail, le nom affiché et les autorisations d’authentification pour la sauvegarde et la restauration. Les informations d’affichage du compte et l’heure de la dernière sauvegarde sont enregistrées sur votre appareil. La déconnexion du compte supprime ses informations d’affichage. Une erreur d’authentification temporaire ne suffit pas, à elle seule, à supprimer les informations d’affichage existantes. L’état d’authentification et les jetons sont gérés par le SDK Google et le système d’exploitation. L’application n’enregistre pas de jetons de manière permanente dans ses propres fichiers ou sauvegardes.\n\nLorsque vous utilisez les fonctions de sauvegarde, de consultation ou de restauration, l’ensemble des notes et étiquettes, la version de l’application et les informations de gestion des sauvegardes sont transmis directement entre votre appareil et Google Drive. Ils ne transitent pas par un serveur du développeur. Les informations du compte et les jetons d’authentification ne sont pas inclus dans les sauvegardes. L’écran Drive peut communiquer avec Google pour vérifier l’état d’authentification existant.\n\nL’application demande l’autorisation drive.appdata pour son espace de stockage masqué dédié. Elle ne demande pas l’autorisation d’accéder à tous les fichiers de votre espace habituel Mon Drive. Elle n’utilise pas les données utilisateur Google à des fins de publicité, de marketing ou de vente et respecte la Google API Services User Data Policy ainsi que les exigences Limited Use applicables.\n\nAprès une sauvegarde réussie, l’application supprime les anciennes sauvegardes valides dans le but de conserver les cinq sauvegardes valides les plus récentes. Des copies supplémentaires peuvent subsister en raison d’erreurs ou de fichiers non vérifiés. Leur suppression automatique dans un délai donné n’est pas garantie.\n\nRègles de confidentialité de Google : https://policies.google.com/privacy\nGoogle API Services User Data Policy : https://developers.google.com/terms/api-services-user-data-policy\n\n3. Demandes par e-mail et soutien financier externe\n\nDemandes par e-mail : Lorsque vous choisissez l’option d’envoi d’un e-mail, la version de l’application, le numéro de compilation, la plateforme d’exécution et la version du système d’exploitation sont transmis à l’écran de rédaction du message. Vous pouvez modifier le contenu et décider de l’envoyer ou non. Les notes, étiquettes, informations du compte, fichiers de sauvegarde et identifiants uniques de l’appareil ne sont pas joints automatiquement. L’enregistrement et la synchronisation des brouillons dépendent du service de messagerie choisi. La fonction de copie de l’adresse copie uniquement l’adresse e-mail du développeur dans le presse-papiers.\n\nLe développeur utilise l’adresse et le nom de l’expéditeur, le corps du message et les pièces jointes des e-mails effectivement envoyés pour répondre aux demandes et analyser les erreurs. Il les gère directement dans Gmail. Les informations liées aux demandes sont conservées au maximum six mois après la fin de leur traitement, puis supprimées. En cas de demande de suppression, elles sont supprimées sans délai, sauf obligation légale distincte de conservation. Les copies restant dans Gmail peuvent être soumises aux politiques de ce service.\n\nSoutien financier externe : Le bouton de soutien ouvre une page Ko-fi externe. L’application n’ajoute pas de notes ou d’informations du compte au lien et ne reçoit pas directement de numéros de carte. Les fonctionnalités sont les mêmes, que vous apportiez ou non un soutien financier. Si vous apportez un soutien, Ko-fi ou les services de paiement peuvent transmettre au développeur des informations telles que votre nom affiché, votre adresse e-mail, votre message et des informations sur la transaction. Ko-fi est exploité par Ko-fi Labs Limited, au Royaume-Uni, et les paiements sont traités par un service de paiement distinct. Le développeur consulte les informations de soutien uniquement dans l’interface de Ko-fi pour vérifier les contributions, sans les télécharger ni les enregistrer dans des fichiers ou bases de données séparés. La conservation et la suppression des informations stockées sur Ko-fi relèvent de ses politiques et des fonctionnalités proposées. Les questions concernant la consultation ou l’utilisation de ces informations par le développeur, ainsi que les demandes de suppression, peuvent être adressées à l’e-mail ci-dessous. Le développeur prendra les mesures relevant de ses possibilités d’intervention et indiquera, si nécessaire, les procédures de Ko-fi. La suppression d’informations sur Ko-fi ne supprime pas nécessairement les enregistrements de transactions conservés séparément par les services de paiement.\n\nPolitique de confidentialité de Ko-fi : https://more.ko-fi.com/privacy\nDemandes de confidentialité à Ko-fi : https://help.ko-fi.com/hc/en-us/requests/new\n\n4. Services externes et traitement à l’étranger\n\nL’authentification Google, Drive, Gmail, Ko-fi et les services de paiement, de messagerie et de stockage de fichiers que vous choisissez peuvent traiter les informations nécessaires à leurs services ainsi que des informations techniques et de connexion. Ce traitement peut avoir lieu en dehors de votre pays de résidence. Les notes, étiquettes et informations de sauvegarde sont transmises à Drive, et les informations des demandes que vous rédigez ou envoyez sont transmises aux services de messagerie. Vous pouvez utiliser les fonctions de notes sur votre appareil sans utiliser les fonctions facultatives.\n\nL’entité juridique qui fournit les services Google dépend des conditions applicables à votre région et à votre compte. Selon les conditions de service pour la Corée du Sud, le fournisseur est Google LLC, aux États-Unis. Pour les utilisateurs de l’Espace économique européen (EEE) et de Suisse, le responsable du traitement des informations est généralement Google Ireland Limited. Google traite les informations sur des serveurs dans le monde entier et applique des durées de conservation et des procédures de suppression différentes selon la nature des informations, les paramètres et les nécessités légales. Celles-ci sont distinctes de la durée maximale de six mois pendant laquelle le développeur conserve les demandes. Ko-fi peut également transférer des informations à des prestataires de services à l’étranger.\n\nConditions d’utilisation de Google : https://policies.google.com/terms\nInformations sur la conservation et la suppression chez Google : https://policies.google.com/technologies/retention\nDemandes de confidentialité à Google : https://support.google.com/policies/troubleshooter/2990837\n\n5. Suppression et gestion des sauvegardes\n\n- Notes et données de l’appareil : Vous pouvez consulter, modifier et supprimer les notes dans l’application. Les notes supprimées peuvent subsister dans d’anciennes copies de récupération ou des sauvegardes distinctes. Vous pouvez gérer les données de l’appareil à l’aide de fonctions telles que l’effacement des données de l’application proposé par le système d’exploitation. La possibilité de restaurer des données après la désinstallation dépend du système d’exploitation.\n- Fichiers exportés : Les fichiers de sauvegarde contenant toutes les notes et étiquettes sont enregistrés dans le dossier de l’appareil ou le service de stockage externe choisi. Vous devez les supprimer directement à cet emplacement ; désinstaller l’application ne les supprime pas automatiquement. L’importation et la restauration remplacent l’ensemble des notes et étiquettes actuelles. Une copie de sécurité réalisée avant la restauration peut subsister.\n- Google Drive : La déconnexion du compte dans l’application ferme la session ; elle ne révoque pas les autorisations Google et ne supprime pas les sauvegardes distantes. Vous pouvez révoquer les autorisations dans la gestion des connexions tierces de votre compte Google. L’application ne dispose pas d’écran permettant de supprimer individuellement les sauvegardes distantes. Vous pouvez supprimer les données masquées dans la gestion des applications des paramètres web de Google Drive. La seule désinstallation de l’application ne supprime pas les sauvegardes Drive.\n\nGuide Google de gestion des données masquées : https://support.google.com/drive/answer/6374270?hl=ko\n\n6. Sécurité et droits des utilisateurs\n\nL’application utilise un espace de stockage qui lui est dédié sur l’appareil, ainsi que HTTPS et l’authentification pour les transferts avec Drive. Elle prévoit une vérification des sauvegardes et une confirmation avant restauration, mais n’applique pas de chiffrement ni de mot de passe supplémentaires propres à l’application aux notes, paramètres ou sauvegardes. Protégez votre appareil et votre compte, et gérez avec précaution les fichiers de sauvegarde contenant des informations personnelles.\n\nVous pouvez demander l’accès, la rectification, la suppression ou la suspension du traitement des informations fournies au développeur en utilisant les coordonnées ci-dessous. Les demandes sont traitées conformément au droit applicable, après vérification de votre habilitation à les présenter. Les représentants légaux peuvent également exercer les droits applicables. Selon votre région de résidence, vous pouvez disposer de droits à la limitation du traitement, à l’opposition, à la portabilité des données et à la réclamation auprès d’une autorité de contrôle. Vous pouvez retirer votre consentement aux traitements fondés sur celui-ci, sans affecter la licéité du traitement effectué avant ce retrait.\n\nLes demandes d’exercice de droits soumises au RGPD (GDPR) reçoivent une réponse sans retard injustifié et, en principe, dans un délai d’un mois à compter de leur réception. Si la complexité ou le nombre de demandes le justifie, ce délai peut être prolongé de deux mois supplémentaires au maximum. Dans ce cas, les motifs de la prolongation sont communiqués pendant le premier mois. En cas de refus, les motifs et la manière d’introduire une réclamation auprès d’une autorité de contrôle sont indiqués.\n\nLe développeur ne peut pas consulter ni supprimer à distance les notes sur votre appareil ou dans votre Drive personnel. Pour les informations traitées de manière indépendante par des services externes, vous pouvez aussi utiliser leurs procédures de gestion.\n\n7. Public visé et modifications\n\nL’application est un outil de prise de notes destiné au grand public et ne s’adresse pas spécifiquement aux enfants. Elle ne collecte pas de dates de naissance et ne propose pas sa propre vérification de l’âge. Cette description ne constitue pas une classification par âge de la boutique d’applications.\n\nCette politique sera mise à jour si les fonctionnalités, les pratiques de traitement ou la législation changent. Les modifications ayant une incidence importante sur vos droits seront notifiées conformément au droit applicable et les consentements nécessaires seront recueillis.\n\n8. Exploitant et demandes relatives à la confidentialité\n\nNom de l’application : HumanDrive\nExploitant et responsable de la protection des informations personnelles : 임수환 (Im Soohwan)\nE-mail : imsoohwan.dev@gmail.com\n"};

function queryLang(){const u=new URL(location.href);let saved=null;try{saved=localStorage.getItem('humandrive_lang')}catch(e){}return u.searchParams.get('lang')||saved||'en'}
function normalizeLang(code){if(SITE_COPY[code])return code;if(code==='zh'||code==='zh-CN')return 'zh-Hans';if(code==='pt')return 'pt-BR';return 'en'}
let activeLang=normalizeLang(queryLang());
function selectLang(code){activeLang=normalizeLang(code);try{localStorage.setItem('humandrive_lang',activeLang)}catch(e){}const u=new URL(location.href);u.searchParams.set('lang',activeLang);history.replaceState({},'',u);applyLang()}
function aText(s){return document.createTextNode(s)}
function applyLang(){let d=SITE_COPY[activeLang];document.documentElement.lang=activeLang;document.querySelectorAll('[data-i18n]').forEach(n=>{const key=n.dataset.i18n;const parts=key.split('.');let v=d;for(const p of parts)v=v?.[p];if(typeof v==='string')n.textContent=v});document.querySelectorAll('[data-privacy-link]').forEach(n=>n.href=(document.body.dataset.page==='privacy'?'index.html':'privacy/index.html')+'?lang='+encodeURIComponent(activeLang));document.querySelectorAll('[data-home-link]').forEach(n=>n.href=(document.body.dataset.page==='privacy'?'../index.html':'index.html')+'?lang='+encodeURIComponent(activeLang));document.querySelector('#language').value=activeLang;document.title=document.body.dataset.page==='privacy'?d.privacy+' — HumanDrive':'HumanDrive — '+d.headline[0];if(document.body.dataset.page==='privacy')renderPolicy()}
document.getElementById('language').addEventListener('change',e=>selectLang(e.target.value));

function renderPolicy(){const raw=POLICY_TEXT[activeLang];const el=document.querySelector('#policy-raw');el.textContent=raw;document.querySelector('#policy-count').textContent=activeLang.toUpperCase()+' / '+raw.length+' CHARACTERS'}
